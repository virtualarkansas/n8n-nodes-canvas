name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create the GitHub release
  id-token: write  # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Never interpolate the tag into a script: it reaches the shell as a variable only.
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all branches, to check that the tag is on main
          persist-credentials: false  # the token must not sit in .git/config while packages install

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main"
            exit 1
          fi

      # No package cache: a job that can publish installs everything fresh.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version in package.json ($VERSION)"
            exit 1
          fi

      # No install scripts: nothing the checks need comes from one, and this job can publish.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The same checks as ci.yml: nothing is published that would not pass a pull request.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm pack

      - name: Determine npm dist-tag
        id: npm_tag
        run: |
          case "$TAG" in
            *alpha*) echo "tag=alpha" >> "$GITHUB_OUTPUT" ;;
            *beta*)  echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            *rc*)    echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)       echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Publishing uses npm trusted publishing: npm exchanges this job's identity token (OIDC) for
      # a short-lived credential, so there is no npm token to store or renew. The trusted
      # publisher is set up on npmjs.com (package settings) for this repository and this file
      # name: renaming this file breaks publishing until it is set up again. It needs npm 11.5.1
      # or later and Node 22 brings npm 10, so a pinned npm is installed next to the project and
      # used for this step only.
      - name: Install an npm that supports trusted publishing
        run: |
          npm install --prefix "$RUNNER_TEMP/npm" --no-save --ignore-scripts --no-audit --no-fund npm@11.21.2
          "$RUNNER_TEMP/npm/node_modules/.bin/npm" --version

      - name: Publish to npm
        run: |
          "$RUNNER_TEMP/npm/node_modules/.bin/npm" publish --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.npm_tag.outputs.tag }}

      # Release notes: the section of CHANGELOG.md for this version (heading "## X.Y.Z ..."),
      # followed by how to install it.
      - name: Release notes
        env:
          DIST_TAG: ${{ steps.npm_tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            /^## / { inside = ($2 == version) ; next }
            inside { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)." > notes.md
          fi
          {
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "npm install @kyancey-va/n8n-nodes-canvas@$DIST_TAG"
            echo '```'
          } >> notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.npm_tag.outputs.tag }}
        run: |
          if [ "$DIST_TAG" = "latest" ]; then
            gh release create "$TAG" ./*.tgz --verify-tag --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" ./*.tgz --verify-tag --title "$TAG" --notes-file notes.md --prerelease
          fi
