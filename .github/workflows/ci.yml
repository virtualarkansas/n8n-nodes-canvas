name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The node and credentials, and the test code (which the test runner does not type-check).
      - name: Type check
        run: npm run typecheck

      # Unit tests need no Canvas or n8n instance: request layer, trigger parsing and
      # the audit of every operation against the Canvas route table.
      - name: Unit tests
        run: npm test
